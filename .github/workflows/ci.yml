name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, types, and registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Build the registry
        run: bun run registry:build

      # The build writes next-env.d.ts and the docs types that check-types needs.
      - name: Build the website
        run: bun run build

      - name: Check types
        run: bun run check-types
