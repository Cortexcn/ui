name: Bug report
description: Something in a component, block, or the registry doesn't work as documented.
labels: ["bug"]
body:
  - type: input
    id: item
    attributes:
      label: Component or block
      description: The name in the registry, such as `marquee` or `hero-cover-01`.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce it
      description: Steps, or a link to a repository or sandbox that shows it.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: React, Next.js or Vite, Tailwind CSS, and browser versions.
